<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Quick Add Widget</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e0ddd8;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .widget {
    width: 360px;
    background: #ffffff;
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
    position: relative;
    overflow: hidden;
  }

  /* ניצוצות ambient — כמעט בלתי נראים */
  .sparkle {
    position: absolute;
    pointer-events: none;
    color: #B070A0;
    z-index: 1;
    transition: opacity 2s;
  }
  .s1 { top: 14px; right: 16px; font-size: 18px; opacity: 0.28; }
  .s2 { top: 8px;  right: 36px; font-size: 10px; opacity: 0.18; }
  .s3 { top: 26px; right: 30px; font-size: 8px;  opacity: 0.2; color: #3DAA65; }
  .s4 { top: 20px; right: 50px; font-size: 6px;  opacity: 0.14; }

  /* כותרת */
  .title {
    font-size: 15px;
    color: #8B6040;
    font-weight: 700;
    margin-bottom: 14px;
    letter-spacing: 0.3px;
    text-shadow: 0 1px 2px rgba(139,96,64,0.15);
  }

  /* container שורת קלט */
  .input-row {
    background: #F5EDE0;
    border-radius: 18px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.04);
  }

  /* כפתור מיקרופון */
  .mic-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(145deg, #22B07A, #1A8E60);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 3px 10px rgba(29,158,117,0.35), 0 0 0 0 rgba(29,158,117,0.2);
    cursor: pointer;
    transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.15s;
    animation: pulse 3s ease-in-out infinite;
    position: relative;
    z-index: 2;
  }

  .mic-btn:active {
    transform: scale(0.92);
    box-shadow: 0 1px 6px rgba(29,158,117,0.3);
  }

  .mic-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 14px rgba(29,158,117,0.45), 0 0 0 4px rgba(29,158,117,0.1);
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 3px 10px rgba(29,158,117,0.35), 0 0 0 0 rgba(29,158,117,0.15); }
    50%       { box-shadow: 0 3px 10px rgba(29,158,117,0.35), 0 0 0 6px rgba(29,158,117,0.06); }
  }

  /* placeholder */
  .placeholder {
    font-size: 14.5px;
    color: #B09080;
    flex: 1;
    text-align: right;
    direction: rtl;
    line-height: 1.4;
    user-select: none;
    transition: opacity 0.4s;
  }
</style>
</head>
<body>

<div class="widget">
  <!-- ניצוצות ambient -->
  <span class="sparkle s1">✦</span>
  <span class="sparkle s2">✦</span>
  <span class="sparkle s3">✦</span>
  <span class="sparkle s4">✦</span>

  <!-- כותרת -->
  <div class="title">Reminders</div>

  <!-- שורת קלט -->
  <div class="input-row">
    <!-- מיקרופון -->
    <div class="mic-btn" id="micBtn">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
        <rect x="7" y="1" width="6" height="11" rx="3" fill="white"/>
        <path d="M4 10 Q4 15 10 15 Q16 15 16 10" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="10" y1="15" x2="10" y2="18" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="7" y1="18" x2="13" y2="18" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <!-- placeholder -->
    <span class="placeholder" id="placeholder">המוח שלך הריץ משהו? תתפוס אותו&#x200F;!</span>
  </div>
</div>

<script>
  var placeholders = [
    'המוח הריץ משהו? תתפוס\u200F!',
    'היה פה משהו — תכתוב\u200F!',
    'פלאש של תזכורת? פה זה נשמר\u200F!'
  ];

  // rotation כל 8 שעות לפי השעה הנוכחית
  var el = document.getElementById('placeholder');
  var idx = Math.floor(new Date().getHours() / 8) % placeholders.length;
  el.textContent = placeholders[idx];
</script>

</body>
</html>
